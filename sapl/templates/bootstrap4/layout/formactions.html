<div{% if formactions.flat_attrs %} {{ formactions.flat_attrs|safe }}{% endif %} class="form-group row sapl-form-actions{% if formactions.css_class %} {{ formactions.css_class }}{% endif %}"{% if formactions.id %} id="{{ formactions.id }}"{% endif %}>
    {% if label_class %}
        <div class="aab {{ label_class }}"></div>
    {% endif %}

    {% if field_class %}
        <div class="{{ field_class }}">
            {{ fields_output|safe }}
        </div>
    {% else %}
        {{ fields_output|safe }}
    {% endif %}
</div>
